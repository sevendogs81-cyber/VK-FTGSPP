# Starter template, not a quality-reproduction recipe.
# Set capture FPS, frame range, camera split and paths before use.
# Research control: fixed-black composite (not the default foreground path).
# Paths are relative to this file. Keep every other field identical to the
# random-background candidate when measuring only the background-policy effect.
pipeline:
  mode: foreground
data:
  fps: 60.0  # Replace with the actual capture rate; not inferred from images.
  name: my_foreground_fixed_black
  root: ../data/my_scene
  frames: {start: 0, stop: 300}
  scale: 0.5
  train_cameras: [0, 1, 2]
  eval_cameras: [3]
  masks:
    source: external
    manifest_path: ../data/my_scene/manifests/masks.json
init:
  backend: carving
  points_path: ../data/my_scene/points_vhull_ibr_stride10
  # Keep geometry initialization stable across training-seed sweeps.
  seed: 0
  num_gaussians: 2000000
  keyframe_stride: 10
train:
  iterations: 30000
  background:
    mode: fixed
    color: [0.0, 0.0, 0.0]
run:
  output_path: ../runs/my_foreground_fixed_black
