# Diagnostic foreground run: half-resolution images and a smaller training
# budget. Still uses 2M generated Gaussians. Paths are relative to this file.
# Prepare separately from full-resolution caches:
#   ftgspp prepare points --method carving --config examples/foreground_preview.yaml \
#     --output data/my_scene/points_vhull_ibr_stride1_preview
pipeline:
  mode: foreground
data:
  name: my_foreground_scene
  root: ../data/my_scene
  frames: {start: 0, stop: 300}
  scale: 0.5
  train_cameras: [0, 1, 2]
  eval_cameras: [3]
  masks:
    source: external
    manifest_path: ../data/my_scene/manifests/masks.json
init:
  # Default foreground route: prepare this cache with --method carving.
  backend: carving
  points_path: ../data/my_scene/points_vhull_ibr_stride1_preview
  # Keep geometry initialization stable across training-seed sweeps.
  seed: 0
  num_gaussians: 2000000
  keyframe_stride: 1
train:
  # Adaptive frame-count budget; explicit iterations override it.
  preset: preview
run:
  output_path: ../runs/my_foreground_preview
