# Calibrated visual-hull + IBR, the default foreground geometry path.
# Prepare PLYs first. Calibrated masks supply bounds; DA3 is the fallback:
#   ftgspp prepare points --method carving \
#     --config examples/foreground_visual_hull.yaml \
#     --output data/my_scene/points_vhull_ibr_stride1 \
#     --resolution 192 --coarse-resolution 48 --sampling surface_band \
#     --surface-band-layers 2 --quality balanced
# The same YAML then trains from that integrity-checked PLY/manifest directory.
pipeline:
  mode: foreground
data:
  name: my_foreground_visual_hull
  root: ../data/my_scene
  frames: {start: 0, stop: 300}
  scale: 1.0
  train_cameras: [0, 1, 2]
  eval_cameras: [3]
  masks:
    source: external
    manifest_path: ../data/my_scene/manifests/masks.json
init:
  backend: carving
  points_path: ../data/my_scene/points_vhull_ibr_stride1
  # Keep geometry initialization stable across training-seed sweeps.
  seed: 0
  num_gaussians: 2000000
  keyframe_stride: 1
train:
  # Adaptive frame-count budget; explicit iterations override it.
  preset: balanced
run:
  output_path: ../runs/my_foreground_visual_hull
