# Starter template, not a quality-reproduction recipe.
# Set capture FPS, frame range, camera split and paths before use.
# Foreground-reconstruction starter. Paths are relative to this file.
pipeline:
  mode: foreground
data:
  fps: 60.0  # Replace with the actual capture rate; not inferred from images.
  name: my_foreground_scene
  root: ../data/my_scene
  frames: {start: 0, stop: 300}
  scale: 1.0
  train_cameras: [0, 1, 2]
  eval_cameras: [3]
  masks:
    source: external
    manifest_path: ../data/my_scene/manifests/masks.json
init:
  # Default foreground route: prepare this cache with --method carving.
  backend: carving
  points_path: ../data/my_scene/points_vhull_ibr_stride1
  # Keep geometry initialization stable across training-seed sweeps.
  seed: 0
  num_gaussians: 2000000
  keyframe_stride: 1
train:
  # Adaptive frame-count budget; explicit iterations override it.
  preset: balanced
run:
  output_path: ../runs/my_foreground_scene
