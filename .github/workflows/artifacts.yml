name: Build release candidates (no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv python install 3.12
      - run: sudo apt-get update && sudo apt-get install -y libvulkan-dev libglm-dev
      - name: Pinned Slang
        run: |
          curl -fsSL https://github.com/shader-slang/slang/releases/download/v2026.10/slang-2026.10-linux-x86_64-glibc-2.27.tar.gz -o "$RUNNER_TEMP/slang.tgz"
          echo "beddadd9b48151aa2d7b556056ea02b9826bde59d4d4fa827b33c5184e42a983  $RUNNER_TEMP/slang.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/slang"
          tar -xzf "$RUNNER_TEMP/slang.tgz" -C "$RUNNER_TEMP/slang"
          echo "$RUNNER_TEMP/slang/bin" >> "$GITHUB_PATH"
      - run: uv build --python 3.12
      - name: Clean wheel import outside checkout
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/installed"
          uv pip install --python "$RUNNER_TEMP/installed/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          installed/bin/ftgspp --help
          installed/bin/ftgspp prepare masks --help
          installed/bin/ftgspp prepare points --help
          installed/bin/ftgspp prepare viewer --help
          installed/bin/ftgspp eval --help
          installed/bin/ftgspp viewer --help
          installed/bin/ftgspp render --help
          installed/bin/python -c 'from ftgspp import _ftgspp_vk; from importlib.resources import files; import importlib.util; assert files("ftgspp").joinpath("shaders/manifest.json").is_file(); assert files("ftgspp.viewer").joinpath("remote.html").is_file(); assert importlib.util.find_spec("torch") is None'
      - name: Check distribution contents and notices
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import tarfile, zipfile
          from pathlib import Path
          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
              names = archive.getnames()
              assert not any(n.endswith((".pyc", ".so", ".spv")) or "__pycache__" in n
                             for n in names)
              assert not any("/dev/tools/" in n or "/.github/workflows/" in n
                             for n in names)
              assert not any(n.split("/", 2)[1] in {"data", "runs", "reports"}
                             for n in names if "/" in n)
              for suffix in (
                  "src/ftgspp/training/background.py",
                  "src/ftgspp/config/training_schedule.py",
                  "src/ftgspp/optional/birefnet.py",
                  "src/ftgspp/optional/visual_hull.py",
                  "src/ftgspp/io/viewer_manifest.py",
                  "src/ftgspp/viewer/remote.html",
                  "native/slang/ftgspp_image_objective.slang",
                  "native/slang/viewer_pack.slang",
                  "dev/CONTRIBUTING.md",
                  "dev/agent-guide.md",
                  "dev/docs/architecture.md",
                  "dev/docs/benchmarks.md",
                  "dev/docs/training-settings.md",
                  "dev/docs/performance-measurements.md",
                  "dev/docs/hardware-validation.md",
                  "dev/docs/migration-history.md",
                  "dev/docs/source-history.md",
                  "docs/install.md",
                  "docs/usage.md",
                  "docs/first-run.md",
                  "docs/viewer.md",
                  "docs/data.md",
                  "docs/performance.md",
                  "scripts/setup.sh",
                  "scripts/setup_profile.sh",
                  "scripts/verify_install.py",
                  "tests/test_gpu_foreground_numeric.py",
                  "examples/make_tiny_scene.py",
                  "examples/foreground_scene.yaml",
                  "examples/foreground_preview.yaml",
                  "examples/scene_preview.yaml",
                  "examples/foreground_fixed_black.yaml",
                  "examples/foreground_point_filtering.yaml",
                  "examples/foreground_visual_hull.yaml",
                  "examples/final_test_manifest.example.json",
              ):
                  assert any(n.endswith(suffix) for n in names), suffix
              assert not any("/dev/local/" in n or "/dev/records/" in n for n in names)
              forbidden = (
                  "docs/arguments.md",
                  "docs/hardware.md",
                  "docs/migration.md",
                  "docs/viewer-reference.md",
                  "CONTRIBUTING.md",
                  "docs/architecture.md",
                  "docs/assets/vk-ftgspp_4danyone_teaser.json",
                  "docs/foreground_reconstruction_plan.md",
                  "docs/initialization_pipeline_improvement_plan.md",
                  "docs/validation.md",
                  "docs/viewer_plan.md",
                  "docs/viewer_performance.md",
                  "docs/viewer_rgba8.md",
                  "docs/viewer_benchmark_20260923.json",
                  "docs/viewer_rgba8_benchmark_20260923.json",
              )
              for suffix in forbidden:
                  assert not any(n.split("/", 1)[-1] == suffix for n in names), suffix
          with zipfile.ZipFile(next(Path("dist").glob("*.whl"))) as archive:
              names = archive.namelist()
              for suffix in ("VKSPLAT-APACHE-2.0.txt", "GLM.txt", "PYBIND11-BSD-3-CLAUSE.txt", "GLFW-ZLIB.txt", "IMGUI-MIT.txt", "radix_sort/LICENSE"):
                  assert any(n.endswith(suffix) for n in names), suffix
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-python312-candidates
          path: dist/

  installer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Full optional setup (no GPU or model downloads)
        run: bash scripts/setup.sh --with-init --with-viewer --with-remote --with-lpips --with-tensorboard --skip-doctor
      - name: Additive setup retains the complete profile
        run: |
          bash scripts/setup.sh --with-remote --skip-apt --skip-doctor
          .venv/bin/python -c 'import ftgspp._ftgspp_viewer, depth_anything_3.api, transformers, torchmetrics, tensorboard, websockets'
      - name: Explicit reset returns to Torch-free headless core
        run: |
          bash scripts/setup.sh --reset-profile --skip-apt --skip-doctor
          .venv/bin/python -c 'import importlib.util; from ftgspp import _ftgspp_vk; assert importlib.util.find_spec("torch") is None; assert importlib.util.find_spec("ftgspp._ftgspp_viewer") is None'
