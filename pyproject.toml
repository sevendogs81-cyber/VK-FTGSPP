[project]
name = "ftgspp-vulkan-community"
version = "0.1.0"
description = "Community FTGSPP pipeline with native Vulkan training and optional DA3 initialization"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.0",
    "omegaconf>=2.3,<2.4",
    "opencv-python-headless==4.12.0.88",
    "pycolmap>=3.12,<3.13",
    "scipy>=1.14",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-subtests>=0.14", "build>=1.2"]
tensorboard = ["tensorboard>=2.18"]
# DA3 publishes a broad application/training dependency list.  FTGSPP uses
# only its inference API, so the uv metadata override below replaces that list
# with the imports exercised by the pinned inference adapter.
da3 = [
    "depth-anything-3==0.1.1", "torch>=2.5", "torchvision>=0.20",
    "addict>=2.4", "einops>=0.8", "evo>=1.33", "imageio>=2.37",
    "moviepy==1.0.3", "pillow>=10", "plyfile>=1.1", "trimesh>=4.4",
    "huggingface-hub>=0.35", "safetensors>=0.4",
]
# Optional Torch dependencies for eval-time LPIPS. TorchMetrics'
# learned-perceptual implementation imports torchvision model definitions.
lpips = ["torch>=2.5", "torchvision>=0.20", "torchmetrics>=1.6"]
birefnet = [
    "torch>=2.5", "torchvision>=0.20", "transformers>=4.45",
    "safetensors>=0.4", "timm>=1.0", "kornia>=0.7", "einops>=0.8",
]
[tool.uv]
# depth-anything-3 0.1.1 imports a small inference subset but declares its
# complete demo/server/training environment (and numpy<2) as hard runtime
# dependencies.  Static metadata keeps the locked install minimal and lets the
# NumPy-2/OpenCV-4.12 runtime used and tested by this project remain coherent.
dependency-metadata = [
    { name = "depth-anything-3", version = "0.1.1", requires-dist = [] },
]

[project.scripts]
ftgspp = "ftgspp.cli:main"

[build-system]
requires = ["scikit-build-core>=0.11", "pybind11==3.0.1"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.source-dir = "native"
cmake.version = ">=3.24"
cmake.args = ["-DCMAKE_POLICY_VERSION_MINIMUM=3.5", "-DBUILD_TESTING=OFF"]
wheel.packages = ["src/ftgspp"]
wheel.license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY.md", "native/shaders/radix_sort/LICENSE"]
sdist.include = [
    "native/**/*.cpp", "native/**/*.h", "native/**/*.slang",
    "native/**/*.comp", "native/**/*.glsl", "native/*.py", "native/CMakeLists.txt",
    "native/shaders/radix_sort/LICENSE", "src/**/*.py", "src/**/*.yaml",
    "dev/tests/**/*.py", "dev/tools/*.py", "dev/tools/README.md", "dev/README.md",
    "docs/*.md", "scripts/setup.sh", "scripts/README.md",
    "examples/*.yaml", "examples/*.json",
    ".github/workflows/*.yml", "LICENSE", "LICENSES/*", "THIRD_PARTY.md",
    "CONTRIBUTING.md", "uv.lock",
]
sdist.exclude = [
    "**/__pycache__/**", "**/*.pyc", "**/*.pyo", ".pytest_cache/**",
    "build/**", ".venv/**", "runs/**", "**/*.spv", "**/*.so",
    "native/shader/**", "src/ftgspp/shaders/**",
    "docs/foreground_reconstruction_plan.md",
    "docs/initialization_pipeline_improvement_plan.md",
    "docs/validation.md",
]

[tool.pytest.ini_options]
testpaths = ["dev/tests"]
pythonpath = ["src", "dev"]
markers = ["gpu: requires a compatible NVIDIA Vulkan GPU"]

[tool.pyright]
pythonVersion = "3.12"
