# Replicated synchronous data parallelism.  Each listed Vulkan device owns a
# full model and Adam state. Raw FP32 gradients are averaged before Adam.
mode: sync
# Vulkan physical-device ordinals (not nvidia-smi). Override per machine; if
# llvmpipe sits between GPUs, two 4090s are often [0, 2] rather than [0, 1].
device_ids: [0, 1]
reduction: mean
reduction_dtype: fp32
# auto is the only alias and always resolves to hierarchical_host.
backend: auto
accumulation:
  # Each rank sums K raw backward passes at one parameter point, finalizes /K,
  # then participates in one /P collective and one Adam update.
  microsteps: 1
clocks:
  optimizer: optimizer_steps
  accumulation: microsteps
  samples: views_seen
  wall: wall_seconds
host_collective:
  algorithm: auto
  # 0 benchmarks 8/16/32/64 MiB concurrently on both ranks and selects by the
  # slower rank. Set a positive value to force a known-good server override.
  bucket_mb: 0
  readback_ring_depth: 3
  upload_ring_depth: 3
  timeout_seconds: 120.0
  # Runtime sparse switch for Gaussian exact records. P=2 auto_exact chooses
  # sparse/dense per step from both ranks' actual active-SH payload bytes.
  sparse_gradients: true
  # Exact runtime codec policy; sorted_sparse/dense are explicit overrides.
  codec_policy: auto_exact
  # Validated ABI labels; native central reduce currently uses fixed rank order.
  reduction_tree: fixed_rank_order_v1
  # Fingerprint policy for checkpoint metadata; does not remap device_ids.
  topology_policy: device_uuid_pci_numa_v1
# flat_epoch maps global optimizer slots onto cached random permutations of the
# complete flat (frame, camera) table. It covers every view once per epoch and
# deliberately does not force ranks onto the same synchronized frame. unique
# remains the step-local no-duplicate policy; with_replacement retains original
# RandomSampler/DDP distribution semantics. torch_random_sampler consumes the
# legacy FTGSPP RandomSampler stream by rank-major global slot. co_frame binds
# one synchronized frame and assigns distinct cameras across ranks when possible.
sampling_policy: flat_epoch
# Derived as len(device_ids) * accumulation.microsteps * train.batch_size.
global_batch_size: 2
# Exact verification downloads the complete model from every device. Keep it
# disabled for production; enable explicitly for diagnostics.
verify_replica_interval: 0
# Changing card count across resume changes global batch/gradient noise and is
# rejected unless explicitly acknowledged.
allow_resume_world_size_change: false
# Large-batch compensation. none keeps historical behaviour;
# effective_batch_adam is the FTGSPP B=P*K quality experiment.
world_size_lr_scaling: none
# Optional wall-clock eval cadence in seconds (0 = step-based eval only).
wall_eval_interval_seconds: 0.0
