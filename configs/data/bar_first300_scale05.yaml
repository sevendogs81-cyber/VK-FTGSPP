name: bar
fps: 60.0
# If any supported time-offset JSON exists, require an entry for every camera.
# Set false only to opt into a warned 0-second fallback for legacy metadata.
strict_time_offsets: true
root: ${oc.env:FTGSPP_BAR_ROOT,/path/to/bar}
video_path: ${oc.env:FTGSPP_BAR_VIDEO_ROOT,${data.root}}
calibration_path: ${data.root}
extracted_path: ${data.root}/images
scale: 0.5
frames:
  start: 0
  stop: 300

# Prepared from SelfCap; empty eval_cameras = train on all views (no hold-out).
train_cameras: null
eval_cameras: []
camera_split_source: null
